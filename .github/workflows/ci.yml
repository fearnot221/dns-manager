name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: bash -n deploy/install-vm.sh deploy/deploy.sh deploy/register-webhook.sh deploy/update-now.sh
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --target runner -t dns-manager-web:verification .
      - run: docker build --target tools -t dns-manager-tools:verification .
      - run: node scripts/verify-docker.mjs
      - run: node scripts/verify-ingress.mjs
      - run: node scripts/verify-compose-cwd.mjs
