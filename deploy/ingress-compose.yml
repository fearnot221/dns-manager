name: dns-manager-ingress
services:
  ingress:
    image: caddy:2-alpine
    restart: unless-stopped
    # Linux VM only. Access is restricted by bind + remote_ip in the Caddyfile.
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    # Official Caddy binary carries this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - /etc/dns-manager/ingress.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: ["/data:uid=1000,gid=1000,mode=0700", "/config:uid=1000,gid=1000,mode=0700", /tmp]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
