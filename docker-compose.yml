name: dns-manager

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a random hex secret}@postgres:5432/aegis_dns?schema=public
  AUTH_URL: ${AUTH_URL:?Set the public HTTPS origin}
  AUTH_SECRET: ${AUTH_SECRET:?Set a persistent random session secret}
  AUTH_TRUST_HOST: "true"
  AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set a persistent 64-character hex key}
  PDNS_MOCK: ${PDNS_MOCK:-false}
  PDNS_API_URL: ${PDNS_API_URL:-}
  PDNS_API_KEY: ${PDNS_API_KEY:-}
  PDNS_SERVER_ID: ${PDNS_SERVER_ID:-localhost}
  AUTH_LOGTO_ID: ${AUTH_LOGTO_ID:-dtvpigx50sgdvy4aeadee}
  AUTH_LOGTO_SECRET: ${AUTH_LOGTO_SECRET:-}
  DNS_APPLICATION_MAX_RECORDS: ${DNS_APPLICATION_MAX_RECORDS:-5000}
  DNS_UNIT_MAX_PENDING_RECORDS: ${DNS_UNIT_MAX_PENDING_RECORDS:-50000}
  DNS_UNIT_MAX_DAILY_RECORDS: ${DNS_UNIT_MAX_DAILY_RECORDS:-100000}
  DNS_UNIT_MAX_PENDING_BYTES: ${DNS_UNIT_MAX_PENDING_BYTES:-33554432}
  DNS_UNIT_MAX_DAILY_BYTES: ${DNS_UNIT_MAX_DAILY_BYTES:-67108864}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_dns
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # New VM installs bind PostgreSQL beneath /home/snmg. The fallback preserves
    # existing named-volume deployments until an explicit offline migration.
    volumes: ["${POSTGRES_DATA_DIR:-postgres_data}:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegis -d aegis_dns"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

  migrate:
    image: dns-manager-tools:${DEPLOY_TAG:-local}
    build: {context: ., target: tools}
    environment: *app-environment
    command: [npm, run, db:migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  seed:
    profiles: [maintenance]
    image: dns-manager-tools:${DEPLOY_TAG:-local}
    build: {context: ., target: tools}
    environment:
      <<: *app-environment
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:-}
    command: [npm, run, db:seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  runtime-db:
    image: dns-manager-tools:${DEPLOY_TAG:-local}
    user: "0:0"
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aegis_dns?schema=public
      RUNTIME_DATABASE_URL_FILE: /run/dns-db/database-url
    command: [node, provision-runtime-db.mjs]
    restart: "no"
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database]
    volumes: ["runtime_db:/run/dns-db"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]

  web:
    image: dns-manager-web:${DEPLOY_TAG:-local}
    build: {context: ., target: runner}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      DATABASE_URL: ""
      RUNTIME_DATABASE_URL_FILE: /run/dns-db/database-url
    volumes: ["runtime_db:/run/dns-db:ro"]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      runtime-db: {condition: service_completed_successfully}
    # The web process receives only the least-privilege DSN file.
    networks: [frontend, database]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  runtime_db:
  postgres_data:
networks:
  frontend:
  database:
    internal: true
