<div class="act">開場</div><div class="grid"><figure><div class="cell" id="frame-01"><div class="dots"></div><div class="ghost" style="right:-2cqw;top:-3cqw;font-size:30cqw;">DNS</div><div class="meta" style="left:6cqw;top:6cqw">DNS MANAGER · 使用教學 · 單位成員與單位管理員篇</div><div class="headline" style="left:6cqw;top:12cqw;width:46cqw;font-size:5.6cqw">申請 DNS，<br>不必再寄信、<br>填紙本。</div><div style="left:6cqw;top:36cqw;width:40cqw;font-size:1.6cqw;color:var(--muted);line-height:1.6">查看・清查・申請・管理成員，<br>都在 DNS Manager 完成。</div><div class="ticket" style="left:47cqw;top:17cqw;width:49cqw;transform:rotate(-2deg)"><div class="flow"><div class="lbl">DNS 申請單</div><div class="rec">lab.example.com <em>A</em> 140.115.10.50</div><span class="pill wait">待審核</span><span class="pill unit">計算機中心</span></div></div><img src="sketch-assets/ncu-emblem.png" style="right:4.2cqw;bottom:3.4cqw;width:3.6cqw" alt=""></div><figcaption><div class="row"><span>01 · 一筆申請</span><span>01-hook · 0:00–0:09</span></div><b>先動的是票卡：</b> 紀錄逐字打出（typewriter），狀態膠囊「待審核」spring-pop，標題由下往上 waterfall。<br><span class="seam">cut → push-left</span></figcaption></figure>
<figure><div class="cell" id="frame-02"><div class="dots"></div><div class="meta" style="left:4.2cqw;top:3.4cqw">你的角色</div><div class="card" style="left:4.2cqw;top:6.6cqw;width:27cqw;height:16cqw"><div class="flow"><h3>單位成員</h3><p>查看單位 DNS、清查、送出新增／變更／刪除申請</p></div></div><div class="card" style="left:4.2cqw;top:24.4cqw;width:27cqw;height:19cqw;border-color:var(--accent);box-shadow:.5cqw .5cqw 0 #2457b8"><div class="flow"><h3>單位管理員</h3><p>成員的全部功能<br><b style="color:var(--accent)">＋ 以學號管理單位成員</b></p></div></div><div class="headline" style="left:36cqw;top:6.4cqw;font-size:3.2cqw">七段，帶你走完一輪</div><div class="list" style="left:36cqw;top:13cqw;width:58cqw"><div class="flow"><ol><li><b>01</b>登入與畫面導覽</li><li><b>02</b>查看單位 DNS</li><li><b>03</b>完成 DNS 清查</li><li><b>04</b>申請新增 DNS</li><li><b>05</b>申請變更或刪除</li><li><b>06</b>追蹤申請紀錄</li><li><b>07</b>單位管理員：管理成員</li></ol></div></div><div class="cap">單位只有兩種角色：成員與管理員。接下來分七段帶你操作。</div></div><figcaption><div class="row"><span>02 · 角色與路線圖</span><span>02-roles · 0:09–0:21</span></div><b>兩張角色卡先 book-open 進場，</b> 右側 7 章清單依序 cascade 排入（grid-card-assemble）。<br><span class="seam">push-left</span></figcaption></figure></div>
